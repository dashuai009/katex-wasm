name: Test and deploy comparison to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build release WASM
        run: node scripts/build-wasm.mjs
      - name: Build pinned latest katex-rs source
        run: node scripts/build-katex-rs.mjs
      - name: Install demo dependencies and browser
        working-directory: demo
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Native regression tests
        run: cargo test --lib
      - name: Random 50-formula correctness gate
        working-directory: demo
        run: |
          npm run test:correctness
          npm run test:api
          node --experimental-wasm-modules ../tests/diff_harness.mjs ../tests/fixtures/performance-regressions.txt --log-level summary
      - name: Build comparison
        working-directory: demo
        run: npm run build:site
      - name: Measure all three engines in Chromium
        working-directory: demo
        run: npm run perf:playwright -- --output perf-results/ci-opt${{ github.run_number }}.json
      - name: Generate Pages with the measured result
        working-directory: demo
        env:
          PUBLIC_PATH: /${{ github.event.repository.name }}/
        run: |
          cp perf-results/ci-opt${{ github.run_number }}.json public/latest-benchmark.json
          npm run build:site
      - name: Verify Pages subpath, English previews, HTML timing and memory stability
        working-directory: demo
        env:
          PUBLIC_PATH: /${{ github.event.repository.name }}/
        run: npm run test:ui
      - name: Keep benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-benchmark
          path: demo/perf-results
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: demo/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
